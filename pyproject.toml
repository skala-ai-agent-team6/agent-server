[project]
name = "repair-agent-server"
version = "0.1.0"
description = "AI Agent Capstone AGENT SERVER Repository"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langgraph>=1,<2"]

[project.optional-dependencies]
pcb = [
    "mcp>=1.20,<2",
    "ultralytics>=8.3,<9",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
